<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Admin · privado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      --ink: #07111c;
      --paper: #f7f3ea;
      --accent: #f0b35a;
      --muted: #6f685f;
      --size: 6.2cm;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 20px;
      padding: 28px 16px 40px;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(240,179,90,.14), transparent 55%),
        #120e09;
      font: 14px/1.45 Manrope, sans-serif;
      color: #f4efe6;
    }
    .toolbar { text-align: center; color: #b7aa96; max-width: 420px; }
    .toolbar strong { color: var(--accent); }
    .toolbar button {
      margin-top: 12px;
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: #1a140c;
      font: 700 15px Manrope, sans-serif;
      cursor: pointer;
    }
    .sticker {
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff 0%, var(--paper) 60%, #efe6d5 100%);
      border: 1px solid #e2d7c4;
      box-shadow: 0 22px 48px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2cm;
      padding: 0.45cm;
      color: var(--ink);
    }
    .sticker .label {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 0.42cm;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sticker .warn {
      font-size: 0.28cm;
      color: #9a4b3a;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    #qr { width: 3.6cm; height: 3.6cm; }
    #qr img, #qr canvas { width: 3.6cm !important; height: 3.6cm !important; }
    .hint { font-size: 12px; color: #b7aa96; text-align: center; max-width: 380px; }
    @media print {
      body { background: #fff; color: #000; }
      .toolbar, .hint { display: none; }
      .sticker { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>QR <strong>admin privado</strong> — solo para ti</div>
    <button type="button" onclick="window.print()">Imprimir / guardar PDF</button>
  </div>
  <div class="sticker">
    <div class="label">Panel</div>
    <div id="qr"></div>
    <div class="warn">No compartir</div>
  </div>
  <p class="hint">Guárdalo en el móvil o en casa. Nunca lo envíes a empresas. El panel sigue protegido con PIN.</p>
  <script>
    const cfg = window.QR_CONFIG || {};
    new QRCode(document.getElementById('qr'), {
      text: cfg.adminUrl || location.origin + '/admin',
      width: 180,
      height: 180,
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
