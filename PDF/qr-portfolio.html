<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Portfolio · público</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="./config.js"></script>
  <style>
    :root {
      --ink: #07111c;
      --paper: #f4f8fb;
      --accent: #2fbfa4;
      --muted: #5d7285;
      --size: 6.2cm;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 20px;
      padding: 28px 16px 40px;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, rgba(47,191,164,.16), transparent 55%),
        #07111c;
      font: 14px/1.45 Manrope, sans-serif;
      color: #e8eef4;
    }
    .toolbar { text-align: center; color: #8fa3b8; max-width: 420px; }
    .toolbar strong { color: var(--accent); }
    .toolbar button {
      margin-top: 12px;
      min-height: 48px;
      padding: 0 22px;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: #04231d;
      font: 700 15px Manrope, sans-serif;
      cursor: pointer;
    }
    .sticker {
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff 0%, var(--paper) 60%, #e7eef4 100%);
      border: 1px solid #d5e0ea;
      box-shadow: 0 22px 48px rgba(0,0,0,.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2cm;
      padding: 0.45cm;
      color: var(--ink);
    }
    .sticker .label {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 0.42cm;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .sticker .name {
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: 0.38cm;
      color: var(--muted);
    }
    #qr { width: 3.6cm; height: 3.6cm; }
    #qr img, #qr canvas { width: 3.6cm !important; height: 3.6cm !important; }
    .hint { font-size: 12px; color: #8fa3b8; text-align: center; max-width: 360px; }
    @media print {
      body { background: #fff; color: #000; }
      .toolbar, .hint { display: none; }
      .sticker { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>QR <strong>público</strong> — compártelo con empresas</div>
    <button type="button" onclick="window.print()">Imprimir / guardar PDF</button>
  </div>
  <div class="sticker">
    <div class="label">Portfolio</div>
    <div id="qr"></div>
    <div class="name" id="nameLabel"></div>
  </div>
  <p class="hint">Este QR apunta a tu web pública. Úsalo en tarjeta, CV o LinkedIn.</p>
  <script>
    const cfg = window.QR_CONFIG || {};
    document.getElementById('nameLabel').textContent = cfg.name || '';
    new QRCode(document.getElementById('qr'), {
      text: cfg.publicUrl || location.origin + '/',
      width: 180,
      height: 180,
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
