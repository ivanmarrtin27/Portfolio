<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Rounded dark plate for thumb contrast -->
  <rect width="512" height="512" rx="96" fill="#121820"/>
  <!-- Soft mint glow -->
  <circle cx="380" cy="140" r="120" fill="#3dd6c3" opacity="0.12"/>
  <!-- Soft coral glow -->
  <circle cx="140" cy="380" r="120" fill="#ff5a3d" opacity="0.14"/>
  <!-- Outer frame -->
  <rect x="72" y="72" width="368" height="368" rx="48" stroke="#3dd6c3" stroke-width="14" opacity="0.35"/>
  <!-- QR finder TL (coral) -->
  <rect x="112" y="112" width="112" height="112" rx="18" fill="#ff5a3d"/>
  <rect x="136" y="136" width="64" height="64" rx="10" fill="#121820"/>
  <rect x="152" y="152" width="32" height="32" rx="6" fill="#ff5a3d"/>
  <!-- QR finder TR (mint) -->
  <rect x="288" y="112" width="112" height="112" rx="18" fill="#3dd6c3"/>
  <rect x="312" y="136" width="64" height="64" rx="10" fill="#121820"/>
  <rect x="328" y="152" width="32" height="32" rx="6" fill="#3dd6c3"/>
  <!-- QR finder BL (mint soft) -->
  <rect x="112" y="288" width="112" height="112" rx="18" fill="#3dd6c3" opacity="0.85"/>
  <rect x="136" y="312" width="64" height="64" rx="10" fill="#121820"/>
  <rect x="152" y="328" width="32" height="32" rx="6" fill="#3dd6c3"/>
  <!-- Data modules (stylized) -->
  <rect x="256" y="256" width="40" height="40" rx="6" fill="#ff5a3d"/>
  <rect x="312" y="256" width="40" height="40" rx="6" fill="#e8eef4"/>
  <rect x="368" y="256" width="32" height="40" rx="6" fill="#ff5a3d" opacity="0.75"/>
  <rect x="256" y="312" width="40" height="40" rx="6" fill="#e8eef4"/>
  <rect x="312" y="312" width="40" height="40" rx="6" fill="#3dd6c3"/>
  <rect x="368" y="312" width="32" height="40" rx="6" fill="#e8eef4" opacity="0.7"/>
  <rect x="256" y="368" width="40" height="32" rx="6" fill="#3dd6c3" opacity="0.8"/>
  <rect x="312" y="368" width="40" height="32" rx="6" fill="#ff5a3d"/>
  <rect x="368" y="368" width="32" height="32" rx="6" fill="#e8eef4"/>
  <!-- Center accent (menu / card hint) -->
  <rect x="232" y="232" width="48" height="48" rx="10" fill="#ff5a3d"/>
  <rect x="244" y="248" width="24" height="4" rx="2" fill="#0b0f14"/>
  <rect x="244" y="258" width="18" height="4" rx="2" fill="#0b0f14"/>
  <rect x="244" y="268" width="22" height="4" rx="2" fill="#0b0f14"/>
</svg>
