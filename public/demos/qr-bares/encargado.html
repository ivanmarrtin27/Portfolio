<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR encargado · Bar Lo Güeno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0f14; --ink: #e8eef4; --muted: #8fa3b8; --accent: #ff5a3d; --card: #141a22; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 28px 16px; background: var(--bg); color: var(--ink);
      font: 500 15px/1.5 Manrope, sans-serif;
    }
    .card {
      width: min(100%, 380px); padding: 28px 24px 24px; text-align: center;
      border: 1px solid rgba(232,238,244,.12); border-radius: 8px; background: var(--card);
    }
    .eyebrow {
      margin: 0 0 8px; font: 700 0.72rem Syne, sans-serif;
      letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
    }
    h1 { margin: 0 0 6px; font: 800 1.55rem/1.1 Syne, sans-serif; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 0.92rem; }
    .qr {
      margin: 0 auto 18px; width: min(100%, 260px); aspect-ratio: 1;
      padding: 14px; background: #fff; border-radius: 8px;
    }
    .qr img { width: 100%; height: 100%; display: block; object-fit: contain; }
    .actions { display: grid; gap: 8px; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 46px; padding: 0 16px; border-radius: 4px; text-decoration: none;
      font-weight: 700; color: var(--ink); border: 1px solid rgba(232,238,244,.14);
    }
    a.primary { background: var(--accent); color: #1a0a07; border-color: var(--accent); }
  </style>
</head>
<body>
  <article class="card">
    <p class="eyebrow">Pegatina encargado</p>
    <h1>Bar Lo Güeno</h1>
    <p class="sub">QR del panel del encargado para gestionar la carta. En esta demo el PIN es <strong>9999</strong>.</p>
    <div class="qr">
      <img src="/assets/demos/qr-bares/qr-encargado.png" width="512" height="512" alt="QR panel encargado Bar Lo Güeno">
    </div>
    <div class="actions">
      <a class="primary" href="https://mi-carta.pages.dev/admin.html?bar=lo-gueno" target="_blank" rel="noopener">Abrir panel del encargado</a>
      <a href="/demos/qr-bares/mesa">Ver QR de la mesa</a>
    </div>
  </article>
</body>
</html>
