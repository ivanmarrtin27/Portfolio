<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klaro-Chat Bot — demo</title>
    <link rel="icon" href="./klaro-logo.png" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1220;
        --ink: #e8eef3;
        --muted: #8a9bab;
        --accent: #00a896;
        --plate: #eef3f7;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'DM Sans', system-ui, sans-serif;
        background:
          radial-gradient(800px 400px at 80% 0%, rgba(0, 168, 150, 0.14), transparent),
          var(--bg);
        color: var(--ink);
        padding: 2rem 1.25rem 3rem;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        text-align: center;
      }
      .brand {
        display: flex;
        justify-content: center;
        margin: 0 0 1.35rem;
      }
      .brand img {
        display: block;
        width: min(20rem, 88vw);
        height: auto;
        margin-inline: auto;
        background: transparent;
        padding: 0;
      }
      h1 {
        font-family: 'Instrument Serif', Georgia, serif;
        font-weight: 400;
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        margin: 0 0 0.5rem;
      }
      p { color: var(--muted); line-height: 1.5; }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.5rem 0;
        justify-content: center;
      }
      a.btn {
        display: inline-flex;
        padding: 0.8rem 1.1rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      }
      a.primary { background: var(--accent); color: #001510; }
      a.ghost { border: 1px solid rgba(238, 243, 247, 0.25); color: var(--ink); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="./klaro-logo.png" alt="Klaro" width="360" height="120" />
      </div>
      <h1>Klaro-Chat Bot</h1>
      <p>
        En desarrollo. Recepcionista con IA por WhatsApp para negocios con cita:
        precios, horarios y reservas 24/7.
      </p>
      <div class="btns">
        <a class="btn primary" id="live" href="https://klaroapp.pages.dev">Ver landing</a>
        <a class="btn ghost" href="https://klaroapp.pages.dev/demo/">Probar chat</a>
        <a class="btn ghost" href="/">Volver al portfolio</a>
      </div>
      <p>
        Código en
        <a href="https://github.com/ivanmarrtin2703/Klaro-Chat-Bot">Klaro-Chat-Bot</a>.
      </p>
    </main>
    <script>
      const live = document.getElementById('live');
      const params = new URLSearchParams(location.search);
      live.href = params.get('live') || 'https://klaroapp.pages.dev';
    </script>
  </body>
</html>
